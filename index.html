<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfcf8">
  <meta name="description" content="freespaces — launching soon.">
  <title>freespaces — Launching soon</title>
  <style>
    :root { color-scheme: light; --ink: #1d241d; --green: #367d58; --soft: #edf3e9; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(226, 238, 219, .72), transparent 39%),
        #fbfcf8;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .ambient {
      position: fixed;
      width: min(74vw, 660px);
      aspect-ratio: 1;
      border: 1px solid rgba(54, 125, 88, .09);
      border-radius: 50%;
      animation: breathe 8s ease-in-out infinite;
      pointer-events: none;
    }
    .ambient::before, .ambient::after {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(54, 125, 88, .08);
      border-radius: inherit;
    }
    .ambient::after { inset: 19%; }
    main { position: relative; z-index: 1; text-align: center; padding: 32px; animation: arrive 1.2s cubic-bezier(.2,.75,.25,1) both; }
    .wordmark { margin: 0; font-size: clamp(54px, 10vw, 100px); line-height: 1; font-weight: 550; letter-spacing: -.075em; }
    .wordmark span { color: var(--green); }
    .divider { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 27px auto 15px; color: #818a7e; }
    .divider::before, .divider::after { content: ""; width: 34px; height: 1px; background: #d8dfd3; }
    .spark { width: 7px; height: 7px; background: #8db77e; border-radius: 50%; box-shadow: 0 0 0 0 rgba(141,183,126,.42); animation: pulse 2.4s ease-out infinite; }
    .tagline { margin: 0; color: #667063; font-size: clamp(15px, 2vw, 18px); letter-spacing: .12em; font-weight: 500; }
    @keyframes breathe { 0%, 100% { transform: scale(.96); opacity: .65; } 50% { transform: scale(1.04); opacity: 1; } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(141,183,126,.48); } 70%, 100% { box-shadow: 0 0 0 10px rgba(141,183,126,0); } }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main>
    <h1 class="wordmark">free<span>spaces</span></h1>
    <div class="divider" aria-hidden="true"><span class="spark"></span></div>
    <p class="tagline">LAUNCHING SOON</p>
  </main>
</body>
</html>
